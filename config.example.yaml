storage:
  root: "./data"

splits:
  train: 0.8
  eval: 0.1
  test: 0.1
  seed: "indonesian-corpus-v1"

download:
  timeout_seconds: 60
  retries: 5
  user_agent: "indonesian-corpus-collector/0.2"

limits:
  max_records_per_source: null

sources:
  youtube:
    enabled: true
    search_query: "bahasa Indonesia"
    max_videos: 10
    include_auto_captions: false
  movies:
    enabled: true
    api_base: "https://api.opensubtitles.com/api/v1"
    search_query: "" # empty uses the latest Indonesian movie subtitles
    language: "id"
    max_subtitles: 10
