[project]
name = "indonesian-corpus-collector"
version = "0.2.0"
description = "Indonesian text corpus collection from captions and subtitles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "yt-dlp>=2025.8,<2027",
]

[project.scripts]
indonesian-corpus-collector = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collectors", "core", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "data", "logs", "pytest-cache-files-*", ".test-tmp*"]
