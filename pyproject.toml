[project]
name = "indonesian-corpus-collector"
version = "0.1.0"
description = "License-aware Indonesian speech corpus acquisition and validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "datasets>=4.0,<5",
  "httpx>=0.28,<1",
  "pandas>=2.2,<3",
  "pyarrow>=22,<26; python_version < '3.14'",
  "pyarrow>=25,<26; python_version >= '3.14'",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "soundfile>=0.13,<1",
  "tenacity>=9.0,<10",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
]

[project.scripts]
indonesian-corpus-collector = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collectors", "core", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
